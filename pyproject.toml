[project]
name = "python-design-patterns"
version = "0.0.0"
description = "Design pattern examples in Python with comparative implementations and metrics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.9",
    "poethepoet>=0.31",
    "radon>=6.0.1",
]

[tool.uv]
package = false

[tool.poe.tasks]
test = "pytest"
test-cov = "pytest --cov --cov-report=term-missing --cov-fail-under=100"
format = "ruff format patterns/behavioural/strategy patterns/behavioural/state"
lint = "ruff check patterns/behavioural/strategy patterns/behavioural/state"
check = { shell = "ruff format --check patterns/behavioural/strategy patterns/behavioural/state && ruff check patterns/behavioural/strategy patterns/behavioural/state" }

[tool.pytest.ini_options]
testpaths = [
    "patterns/behavioural/strategy/tests",
    "patterns/behavioural/state/tests",
]
pythonpath = [
    ".",
    "patterns/behavioural",
]
addopts = ["-vv"]

[tool.coverage.run]
source = [
    "patterns/behavioural/strategy/**",
    "patterns/behavioural/state/**",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
